<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcanum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
<div class="brand"><span class="mark">◆</span><div><b>ARCANUM</b><small>Indian market intelligence</small></div></div>
<button id="refresh" class="icon">⟳</button>
</header>
<div class="searchrow">
<input id="search" placeholder="Search symbol, company or headline…">
<button id="clear">×</button>
</div>
<nav id="tabs">
<button data-tab="results" class="active">RESULTS <i id="n-results">0</i></button>
<button data-tab="actions">ACTIONS <i id="n-actions">0</i></button>
<button data-tab="filings">FILINGS <i id="n-filings">0</i></button>
<button data-tab="news">NEWS <i id="n-news">0</i></button>
<button data-tab="firms">FIRMS <i id="n-firms">0</i></button>
<button data-tab="watchlist">WATCHLIST <i id="n-watch">0</i></button>
</nav>
<main>
<div id="status">Loading live web data…</div>
<section id="watchPanel" hidden>
<div class="add"><input id="watchInput" placeholder="Add NSE symbol e.g. RELIANCE"><button id="addWatch">ADD</button></div>
<div id="watchRows"></div>
</section>
<section id="list"></section>
<div id="empty" hidden>No matching items.</div>
</main>
<footer><span id="updated">Not updated</span><span>NSE + Google News + Yahoo Finance · v2.0.0</span></footer>
<script>
/* If anything stops the app from starting, say so on screen instead of freezing on "Loading". */
(function () {
  function show(msg) {
    var s = document.getElementById("status");
    if (!s) return;
    s.textContent = "\u26a0 " + msg;
    s.style.color = "#c81e1e";
    s.style.whiteSpace = "pre-wrap";
  }
  window.__arcanumShow = show;
  window.onerror = function (m, src, line) { show("Script error: " + m + " (line " + line + ")"); };
  window.addEventListener("unhandledrejection", function (e) {
    show("Error: " + ((e.reason && e.reason.message) || e.reason));
  });
  /* app.js sets window.__arcanumReady as soon as it starts. If it never does, the file is
     empty, cut off, or an old copy - say so instead of sitting on "Loading". */
  setTimeout(function () {
    if (window.__arcanumReady) return;
    var s = document.getElementById("status");
    if (s && s.textContent.indexOf("\u26a0") !== 0) {
      show("The app script did not start - app.js is empty, cut off or an old copy. Re-upload app.js (it should be about 39 KB and end with: }, 5 * 60 * 1000);)");
    }
  }, 4000);
})();
</script>
<script src="app.js" onerror="window.__arcanumShow('app.js could not be loaded')"></script>
</body>
</html>
