<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bazaar Board</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <h1>Bazaar Board</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" title="Refresh">⟳</button>
    </header>

    <div class="subbar">
      <span id="statusText">Loading…</span>
      <a href="#" id="optionsLink">Sources & firms</a>
    </div>

    <div class="chips" id="chipRow"></div>

    <main id="list" class="list">
      <div class="empty" id="emptyState" hidden>No tracked-firm mentions in the current feeds yet.</div>
    </main>

    <footer class="footer">
      Real headlines pulled live from public news feeds (Moneycontrol, Business Standard, HT Business, Mint).
      Not investment advice — always verify with the original article before acting.
    </footer>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
